name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install custom design dependencies
        run: npm ci

      - name: Install ScrewFast dependencies
        run: npm ci --ignore-scripts
        working-directory: variants/screwfast

      - name: Install AstroWind dependencies
        run: npm ci --ignore-scripts
        working-directory: variants/astrowind

      - name: Prepare IT Audit Pro variant (fetches the theme from the author's repository)
        run: node scripts/prepare-audit.mjs

      - name: Install IT Audit Pro dependencies
        run: npm ci --ignore-scripts
        working-directory: variants/audit-pro

      - name: Install molique design dependencies
        run: npm ci --ignore-scripts
        working-directory: variants/molique-site

      - name: Install motion design dependencies
        run: npm ci --ignore-scripts
        working-directory: variants/motion-site

      - name: Build all six sites
        run: node scripts/build-pages.mjs
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: ${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
